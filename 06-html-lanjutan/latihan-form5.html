<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Try 1 In The Table</title>
</head>
<body>
  <h1>Contoh element element form padaH HTML</h1>

  <form>
    <table cellpadding="5">
      <tr>
        <td align="right"><label for="nama">Nama: </label></td>
        <td><input name="nama" id="nama" placeholder="Masukan Nama"></td>
      </tr>
      <tr>
        <td align="right"><label for="password">Password: </label></td>
        <td><input type="password" name="password" id="password" placeholder="Masukan Password"></td>
      </tr>
      <tr>
        <td align="right"><label for="email">Email: </label></td>
        <td><input type="email" name="email" id="email" placeholder="Masukan Email"></td>
      </tr>
      <tr>
        <td align="right"><label for="angka">Masukan angka: </label></td>
        <td><input type="number" name="angka" id="angka" placeholder="Masukan Angka" min="1" max="100" step="4"></td>
      </tr>
      <tr>
        <td align="right"><label for="tanggal">Masukan Tanggal: </label></td>
        <td><input type="date" name="tanggal" id="tanggal"></td>
      </tr>
      <tr>
        <td align="right"><label for="warna">Masukan Warna: </label></td>
        <td><input type="color" name="warna" id="warna"></td>
      </tr>
      <tr>
        <td colspan="2"><button type="submit">Kirim</button></td>
      </tr>
    </table>
  </form>
</body>
</html>
