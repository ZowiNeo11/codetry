<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Font CSS 1</title>
    <style>
      h1 {
        color: navy;
        font-size: 60px;
        text-align: center;
        font-family: "Comic Sans MS", sans-serif;
      }
      P {
        color: grey;
        text-align: center;
        font-size: 30px;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Hello Dandi!</h1>
    <p>
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ut beatae non
      illum accusamus hic aspernatur dicta dignissimos quod magnam quo.
    </p>
  </body>
</html>
